title: PowerShell EncodedCommand Execution
id: 8a3e9b42-ec9f-4eaf-9b31-encodedcommand-demo
status: experimental
description: >
  Detects PowerShell execution using the -EncodedCommand parameter,
  a technique commonly used to obfuscate malicious payloads.
author: jaffylz
date: 2026-01-28
references:
  - https://attack.mitre.org/techniques/T1059/001/
logsource:
  product: windows
  service: sysmon
selection:
  EventID: 1
  Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
  CommandLine|contains:
    - '-EncodedCommand'
    - '-enc'
  condition: selection

level: high
tags:
  - attack.execution
  - attack.t1059.001
